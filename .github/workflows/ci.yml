name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Android build step needs several GB for the NDK/CMake it downloads;
      # ubuntu-latest's preinstalled toolchains (dotnet, ghc, unused NDK/SDK
      # versions, CodeQL) eat into that and have made the build step fail with
      # "No space left on device" (confirmed 2026-10-18, runs 39109076040 and
      # 39067060068). None of these are used by this Flutter-only repo.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Added because #017 landed first (strict-casts/inference/raw-types +
      # riverpod_lint surface via `flutter analyze`; this is the fix-hygiene gate).
      # NOTE: `dart fix --dry-run` exits 0 even when fixes are proposed, so
      # grep for the clean marker to make this step fail when fixes exist.
      - name: Check for auto-fixable issues
        run: |
          output="$(dart fix --dry-run 2>&1)"
          echo "$output"
          echo "$output" | grep -q "Nothing to fix!"

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK (smoke check)
        run: flutter build apk --debug
